<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Karla:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap");
        :root {
            --bg: #0f172a;
            --card: #0b1220;
            --accent: #f59e0b;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --border: rgba(148, 163, 184, 0.2);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Karla", sans-serif;
            background: radial-gradient(circle at top left, #1f2937, #0f172a 45%);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .card {
            width: min(420px, 90vw);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        h2 {
            font-family: "Playfair Display", serif;
            margin: 0 0 6px;
        }
        p { color: var(--muted); margin: 0 0 20px; }
        label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0b1220;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #1f2937;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Admin Login</h2>
    <p>Secure access to bookings, food, and users.</p>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" placeholder="" required>
        <label>Password</label>
        <input type="password" name="password" placeholder="" required>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
