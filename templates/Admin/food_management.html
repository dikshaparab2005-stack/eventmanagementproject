<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Food Items</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Karla:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap");
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #0b1220;
      --accent: #f59e0b;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Karla", sans-serif;
      background: radial-gradient(circle at top left, #1f2937, #0f172a 45%);
      color: var(--text);
    }
    .layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background:linear-gradient(160deg, rgba(178, 6, 197, 0.532) 0%, rgb(190, 166, 190) 60%);
      padding: 28px 18px;
      border-right: 1px solid var(--border);
    }
    .brand {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      margin-bottom: 26px;
    }
    .nav a {
      display: block;
      color: var(--text);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      transition: all 0.2s ease;
    }
    .nav a:hover { background: rgba(255, 255, 255, 0.06); }
    .nav a.active {
      background: rgba(245, 158, 11, 0.2);
      color: #fef3c7;
    }
    .content { padding: 32px; }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 18px;
      margin-bottom: 18px;
    }
    .panel h2 { margin: 0 0 10px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #0b1220;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
    }
    .btn {
      background: var(--accent);
      color: #1f2937;
      font-weight: 700;
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    th { color: var(--muted); }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: #1f2937;
      color: var(--text);
      border: 1px solid var(--border);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 2; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Event Admin</div>
    <nav class="nav">
      <a href="{{ url_for('admin.admin_dashboard') }}">Dashboard</a>
      <a class="active" href="{{ url_for('admin.manage_food') }}">Manage Food</a>
      <a href="{{ url_for('admin.view_bookings') }}">Bookings</a>
      <a href="{{ url_for('home') }}">Logout</a>
    </nav>
  </aside>

  <main class="content">
    <div class="panel">
      <h2>Add New Food Item</h2>
      <form method="POST" class="form-grid">
        <input type="hidden" name="action" value="add">
        <div>
          <label>Name</label>
          <input type="text" name="name" required>
        </div>
        <div>
          <label>Category</label>
          <select name="category" required>
            <option value="Startup">Startup</option>
            <option value="Main">Main</option>
            <option value="Dessert">Dessert</option>
          </select>
        </div>
        <div>
          <label>Price</label>
          <input type="number" name="price" min="1" required>
        </div>
        <div>
          <button type="submit" class="btn">Add Item</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Food Items</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for food in foods %}
          <tr>
            <form method="POST">
              <input type="hidden" name="food_id" value="{{ food.id }}">
              <td>{{ food.id }}</td>
              <td><input type="text" name="name" value="{{ food.name }}" required></td>
              <td>
                <select name="category" required>
                  <option value="Startup" {% if food.category=='Startup' %}selected{% endif %}>Startup</option>
                  <option value="Main" {% if food.category=='Main' %}selected{% endif %}>Main</option>
                  <option value="Dessert" {% if food.category=='Dessert' %}selected{% endif %}>Dessert</option>
                </select>
              </td>
              <td><input type="number" name="price" min="1" value="{{ food.price }}" required></td>
              <td class="actions">
                <button type="submit" name="action" value="edit" class="btn">Save</button>
                <button type="submit" name="action" value="delete" class="btn btn-secondary" onclick="return confirm('Are you sure?')">Delete</button>
              </td>
            </form>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
