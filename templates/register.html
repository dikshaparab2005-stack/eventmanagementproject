<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="form-container">
  <h2>Event Registration</h2>
  <form id="registrationForm" method="POST" action="{{ url_for('register') }}">

  <div class="input-group">
    <label>Full Name</label>
    <input type="text" id="fullname" name="fullname" required pattern="[A-Za-z ]{3,}" minlength="3" title="Only letters and spaces, minimum 3 characters">
  </div>

  <div class="input-group">
    <label>Phone Number</label>
    <input type="tel" id="number" name="number" required pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric" title="Enter a valid 10-digit Indian mobile number starting with 6-9">
  </div>

  <div class="input-group">
    <label>Email</label>
    <input type="email" id="email" name="email" required pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Enter a valid email with @ and domain">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" id="password" name="password" required minlength="6" title="Password must be at least 6 characters">
  </div>

  <div class="input-group">
    <label>Address</label>
    <input type="text" id="address" name="address" required minlength="10" title="Address must be at least 10 characters">
  </div>

  <button type="submit">Register</button>

</form>
  <script src="{{ url_for('static', filename='Js/script.js') }}"></script>
  <script>
    (function () {
      const nameInput = document.getElementById("fullname");
      const phoneInput = document.getElementById("number");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const addressInput = document.getElementById("address");

      if (nameInput) {
        const namePattern = /^[A-Za-z ]{3,}$/;
        nameInput.addEventListener("blur", () => {
          const value = (nameInput.value || "").trim();
          if (!value) {
            nameInput.setCustomValidity("");
            return;
          }
          if (!namePattern.test(value)) {
            nameInput.setCustomValidity("Only letters and spaces, minimum 3 characters.");
          } else {
            nameInput.setCustomValidity("");
          }
        });
      }

      if (phoneInput) {
        const phonePattern = /^[6-9][0-9]{9}$/;
        phoneInput.addEventListener("blur", () => {
          const value = (phoneInput.value || "").trim();
          if (!value) {
            phoneInput.setCustomValidity("");
            return;
          }
          if (!phonePattern.test(value)) {
            phoneInput.setCustomValidity("Enter a valid 10-digit Indian mobile number starting with 6-9.");
          } else {
            phoneInput.setCustomValidity("");
          }
        });
      }

      if (emailInput) {
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        emailInput.addEventListener("blur", () => {
          const value = (emailInput.value || "").trim();
          if (!value) {
            emailInput.setCustomValidity("");
            return;
          }
          if (!emailPattern.test(value)) {
            emailInput.setCustomValidity("Email must include @ and a valid domain, no spaces.");
          } else {
            emailInput.setCustomValidity("");
          }
        });
      }

      if (passwordInput) {
        passwordInput.addEventListener("blur", () => {
          const value = (passwordInput.value || "").trim();
          if (!value) {
            passwordInput.setCustomValidity("Password cannot be empty.");
            return;
          }
          if (value.length < 6) {
            passwordInput.setCustomValidity("Password must be at least 6 characters.");
          } else {
            passwordInput.setCustomValidity("");
          }
        });
      }

      if (addressInput) {
        addressInput.addEventListener("blur", () => {
          const value = (addressInput.value || "").trim();
          if (!value) {
            addressInput.setCustomValidity("");
            return;
          }
          if (value.length < 10) {
            addressInput.setCustomValidity("Address must be at least 10 characters.");
          } else {
            addressInput.setCustomValidity("");
          }
        });
      }
    })();
  </script>
</body>
</html>
