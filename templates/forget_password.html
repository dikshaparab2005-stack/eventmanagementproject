<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .message {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }
        .message.success { color: #16a34a; }
        .message.error { color: #dc2626; }
        .btn-row {
            position: relative;
        }
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
        }
        .is-loading .spinner { display: inline-block; }
        .is-loading button { opacity: 0.85; pointer-events: none; }
        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Reset Password</h2>
        <form id="resetForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Enter a valid email with @ and domain">
            </div>
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required minlength="6" title="Password must be at least 6 characters">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
            </div>
            <div class="btn-row" id="btnRow">
                <button type="submit">Reset Password</button>
                <span class="spinner" aria-hidden="true"></span>
            </div>
            <div id="formMessage" class="message" role="status" aria-live="polite"></div>
        </form>
    </div>
    <script>
        (function () {
            const form = document.getElementById("resetForm");
            const emailInput = document.getElementById("email");
            const newPasswordInput = document.getElementById("newPassword");
            const confirmPasswordInput = document.getElementById("confirmPassword");
            const messageEl = document.getElementById("formMessage");
            const btnRow = document.getElementById("btnRow");

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = `message ${type}`;
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = (emailInput.value || "").trim();
                const password = newPasswordInput.value || "";
                const confirm = confirmPasswordInput.value || "";

                if (!email || !password || !confirm) {
                    showMessage("All fields are required.", "error");
                    return;
                }
                if (!emailPattern.test(email)) {
                    showMessage("Please enter a valid email address.", "error");
                    return;
                }
                if (password.length < 6) {
                    showMessage("Password must be at least 6 characters.", "error");
                    return;
                }
                if (password !== confirm) {
                    showMessage("Passwords do not match.", "error");
                    return;
                }

                try {
                    if (btnRow) btnRow.classList.add("is-loading");
                    const res = await fetch("/reset-password", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showMessage(data.message || "Password updated successfully.", "success");
                        form.reset();
                        setTimeout(() => {
                            window.location.href = "/login";
                        }, 1200);
                    } else {
                        showMessage(data.message || "Something went wrong.", "error");
                    }
                } catch (err) {
                    showMessage("Network error. Please try again.", "error");
                } finally {
                    if (btnRow) btnRow.classList.remove("is-loading");
                }
            });
        })();
    </script>
</body>
</html>
